version: "3.9"

services:
  research-lab:
    build: .
    container_name: research-agency-lab
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./config:/app/config
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - STREAMLIT_SERVER_HEADLESS=true
